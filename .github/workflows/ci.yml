name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, find unused code and run unit tests
        run: npm run check

      - name: Check this repo's .editorconfig matches config/dogfood.json
        run: node scripts/renderConfig.ts config/dogfood.json --check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache .NET SDKs for every cataloged band
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dotnet
          key: dotnet-sdks-${{ hashFiles('catalog/generated/bands.json') }}

      - name: Test CatalogBuilder
        run: dotnet test --solution dotnet-config-wizard.slnx

      # Proves the SDK layout assertions still hold and every analyzer loads. It doesn't compare the
      # output, because dotnet/docs and SDK releases change upstream; the scheduled refresh workflow owns that.
      - name: Build catalog from every supported SDK
        run: node scripts/buildCatalog.ts
